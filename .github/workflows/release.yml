name: Bygg skrivbordsappar

# Så skapas en ny version:
#   1. Höj "version" i package.json (t.ex. 0.1.0 -> 0.2.0).
#   2. Slå ihop ändringen till main.
#   => Installationsfiler för Windows och Linux byggs och läggs upp som
#      GitHub Release "v0.2.0". Finns releasen redan händer ingenting.
#
# Det går också att starta flödet för hand under Actions -> "Bygg skrivbordsappar"
# -> "Run workflow", eller att pusha en tagg som v0.2.0.
# I pull requests som ändrar paketeringen byggs filerna bara som test.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - electron/**
      - build/**
      - .gitattributes
      - .github/workflows/release.yml
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(node -p "require('./package.json').version")
          fi
          release=false
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]] && ! gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release=true
          fi
          echo "Version: $version, ny release: $release"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux
          # macOS är tillfälligt borttaget: kontot får inga macOS-maskiner i
          # GitHub Actions. Lägg tillbaka raderna nedan när det fungerar:
          # - os: macos-latest
          #   platform: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sätt versionsnumret
        shell: bash
        run: npm version "${{ needs.plan.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.platform }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: LinuxLearningTool-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  release:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Skapa GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh release create "v$VERSION" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LinuxLearningTool v$VERSION" \
            --notes-file .github/release-notes.md
