name: CI

on:
  push:
  pull_request:

# A new push replaces the run that is still going for the same branch or pull request.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  # The TypeScript version of the apps (ts/, docs/TYPESCRIPT-MIGRATION.md): type check and Vitest.
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Every test on both systems, except Codestead GP's TaskTests (the simulated GPU gives the same pictures on both).
  dotnet:
    name: .NET (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build -- --filter-not-class Codestead.GP.Tests.TaskTests

  # Codestead GP's TaskTests – every task of every chapter in every API through the simulated GPU – in parallel jobs by
  # course part. Every part with lessons must be in one list (CiTests checks it).
  gp-tasks:
    name: GP tasks (${{ matrix.parts }})
    strategy:
      fail-fast: false
      matrix:
        parts:
          - 'start,getting-started'
          - 'lighting,model-loading'
          - 'advanced-opengl'
          - 'advanced-lighting'
          - 'pbr'
          - 'in-practice'
          - 'guest-articles'
    runs-on: ubuntu-latest
    env:
      CODESTEAD_GP_PARTS: ${{ matrix.parts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test --project tests/GP/Codestead.GP.Tests -c Release -- --filter-class Codestead.GP.Tests.TaskTests

  # The same TaskTests in the TypeScript port (ts/packages/gp-course), in parallel jobs by course part. Every part with
  # lessons must be in one list (the TypeScript CiTests check it; the lists are in double quotes so that the C# CiTests,
  # which read the single-quoted lists above, don't count them twice).
  ts-gp-tasks:
    name: TypeScript GP tasks (${{ matrix.parts }})
    strategy:
      fail-fast: false
      matrix:
        parts:
          - "start,getting-started,lighting,model-loading,advanced-opengl"
          - "advanced-lighting"
          - "pbr"
          - "in-practice"
          - "guest-articles"
    runs-on: ubuntu-latest
    env:
      CODESTEAD_GP_PARTS: ${{ matrix.parts }}
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - run: npx vitest run packages/gp-course/test/TaskTests.test.ts
