name: CI

on:
  push:
  pull_request:

# A new push replaces the run that is still going for the same branch or pull request.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  # The end-to-end tests drive the apps' Electron window with Playwright, which is not a dependency of the workspace.
  PLAYWRIGHT_VERSION: 1.63.0

jobs:
  # The apps (ts/, an npm workspace): type check and every Vitest test except Codestead GP's TaskTests (below).
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Codestead GP's TaskTests (ts/packages/gp-course) – every task and exercise of every chapter in every API through the
  # simulated GPU – in parallel jobs by course parts and chapters. Every lesson must be in exactly one job, here and in
  # release.yml (ts/packages/gp-course/test/CiTests.test.ts checks it).
  gp-tasks:
    name: GP tasks (${{ matrix.shard.name }})
    strategy:
      fail-fast: false
      matrix:
        # About 7 minutes of tests each (measured on CI, November 2026): the heavy chapters (bloom, ssao, specular-ibl,
        # area-lights, render-text, powerups, deferred-shading …) are spread over the jobs. `chapters` narrows the parts
        # to some chapters, or leaves some out with "!"; CiTests.test.ts checks that every lesson is in exactly one job.
        shard:
          - { name: 'getting started … advanced OpenGL, PBR', parts: 'start,getting-started,going-3d,lighting,model-loading,advanced-opengl,pbr', chapters: '!specular-ibl' }
          - { name: 'specular-ibl, deferred-shading', parts: 'pbr,advanced-lighting', chapters: 'specular-ibl,deferred-shading' }
          - { name: 'advanced lighting, bloom', parts: 'advanced-lighting', chapters: '!ssao,!point-shadows,!deferred-shading' }
          - { name: 'ssao, point-shadows', parts: 'advanced-lighting', chapters: 'ssao,point-shadows' }
          - { name: 'render-text, powerups', parts: 'in-practice', chapters: 'render-text,powerups' }
          - { name: 'in practice', parts: 'in-practice', chapters: '!render-text,!powerups' }
          - { name: 'area-lights, tessellation', parts: 'guest-articles', chapters: 'area-lights,tessellation,tessellation-height-map' }
          - { name: 'guest articles', parts: 'guest-articles', chapters: '!area-lights,!tessellation,!tessellation-height-map' }
    runs-on: ubuntu-latest
    env:
      CODESTEAD_GP_PARTS: ${{ matrix.shard.parts }}
      CODESTEAD_GP_CHAPTERS: ${{ matrix.shard.chapters }}
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - run: npx vitest run packages/gp-course/test/TaskTests.test.ts

  # Each app built and driven in its real Electron window (npm run test:e2e in ts/apps/<app>; the tests start their own
  # Xvfb). Electron's sandbox needs its setuid helper here: Ubuntu's AppArmor rule stops the user namespaces it would
  # use otherwise (the native packages make the helper setuid root the same way, packaging/ts/postinstall.sh).
  e2e:
    name: End-to-end (${{ matrix.app }})
    strategy:
      fail-fast: false
      matrix:
        app: [linux, gp, hub]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - name: Install Xvfb and Playwright
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          npm install -g "playwright@$PLAYWRIGHT_VERSION"
          # Electron fetches its binary on first use, not at npm ci: fetch it now so its sandbox helper exists.
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: NODE_PATH="$(npm root -g)" npm run test:e2e
        working-directory: ts/apps/${{ matrix.app }}
