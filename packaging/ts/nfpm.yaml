# nfpm config for the native Linux packages of one TypeScript/Electron Codestead tool (.deb, .rpm, Arch .pkg.tar.zst):
# the same package, files and paths as packaging/nfpm.yaml (the C# app's), with Electron's libraries as dependencies
# and its sandbox helper made setuid root. Values come from environment variables set by packaging/build-linux.sh --ts.
name: ${PKG_NAME}
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: education
priority: optional
maintainer: JesperE98 <noreply@github.com>
vendor: JesperE98
homepage: https://github.com/JesperE98/codestead-releases
license: Proprietary
description: |
  ${PKG_DESCRIPTION}

# The shared libraries Electron (Chromium) links against (readelf -d <exe>.bin), and xdg-utils for opening web links.
overrides:
  deb:
    # The t64 package first (Ubuntu 24.04 and later): the old names are virtual there, and apt could otherwise choose
    # another package that provides them (liboss4-salsa-asound2 for libasound2, which lacks ALSA's functions).
    depends:
      - libc6
      - libgcc-s1
      - libglib2.0-0t64 | libglib2.0-0
      - libgtk-3-0t64 | libgtk-3-0
      - libnss3
      - libnspr4
      - libatk1.0-0t64 | libatk1.0-0
      - libatk-bridge2.0-0t64 | libatk-bridge2.0-0
      - libatspi2.0-0t64 | libatspi2.0-0
      - libcups2t64 | libcups2
      - libdbus-1-3
      - libcairo2
      - libpango-1.0-0
      - libx11-6
      - libxcb1
      - libxcomposite1
      - libxdamage1
      - libxext6
      - libxfixes3
      - libxrandr2
      - libxkbcommon0
      - libgbm1
      - libexpat1
      - libudev1
      - libasound2t64 | libasound2
      - xdg-utils
    # Fonts for Chinese, Japanese, Arabic and Hindi (installed by default on desktop systems).
    recommends:
      - fonts-noto-core
      - fonts-noto-cjk
  rpm:
    # By library name: the packages that have them differ between Fedora versions.
    depends:
      - glibc
      - libgcc
      - libglib-2.0.so.0()(64bit)
      - libgtk-3.so.0()(64bit)
      - libnss3.so()(64bit)
      - libnspr4.so()(64bit)
      - libatk-1.0.so.0()(64bit)
      - libatk-bridge-2.0.so.0()(64bit)
      - libatspi.so.0()(64bit)
      - libcups.so.2()(64bit)
      - libdbus-1.so.3()(64bit)
      - libcairo.so.2()(64bit)
      - libpango-1.0.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libxcb.so.1()(64bit)
      - libXcomposite.so.1()(64bit)
      - libXdamage.so.1()(64bit)
      - libXext.so.6()(64bit)
      - libXfixes.so.3()(64bit)
      - libXrandr.so.2()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libgbm.so.1()(64bit)
      - libexpat.so.1()(64bit)
      - libudev.so.1()(64bit)
      - libasound.so.2()(64bit)
      - xdg-utils
    recommends:
      - google-noto-sans-fonts
      - google-noto-sans-cjk-fonts
      - google-noto-sans-arabic-fonts
      - google-noto-sans-devanagari-fonts
  archlinux:
    depends:
      - glibc
      - gcc-libs
      - glib2
      - gtk3
      - nss
      - nspr
      - at-spi2-core
      - libcups
      - dbus
      - cairo
      - pango
      - libx11
      - libxcb
      - libxcomposite
      - libxdamage
      - libxext
      - libxfixes
      - libxrandr
      - libxkbcommon
      - mesa
      - expat
      - systemd-libs
      - alsa-lib
      - xdg-utils

contents:
  - src: ${PUBLISH_DIR}/
    dst: /opt/${PKG_NAME}/
    type: tree
  - src: ${GEN_DIR}/launcher.sh
    dst: /usr/bin/${PKG_NAME}
    file_info:
      mode: 0755
  - src: ${GEN_DIR}/app.desktop
    dst: /usr/share/applications/${PKG_NAME}.desktop
  - src: build/icons/${PKG_NAME}.png
    dst: /usr/share/icons/hicolor/1024x1024/apps/${PKG_NAME}.png

scripts:
  postinstall: ${GEN_DIR}/postinstall.sh
# pacman runs post_upgrade (not post_install) on an upgrade.
archlinux:
  scripts:
    postupgrade: ${GEN_DIR}/postinstall.sh
